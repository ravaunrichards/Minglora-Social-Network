name: MeetWave CI and Android release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meetwave-main-build
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test website and build Android APK
    runs-on: ubuntu-latest
    env:
      MEETWAVE_SERVER_URL: https://meetwave-video-conferencing.onrender.com
      MEETWAVE_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install server dependencies
        run: npm install --no-audit --no-fund

      - name: Run website, API, room and WebSocket integration tests
        run: npm test

      - name: Check dependency advisories
        run: npm audit --audit-level=high

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare protected Android signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MEETWAVE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MEETWAVE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MEETWAVE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MEETWAVE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64}${STORE_PASSWORD}${KEY_ALIAS}${KEY_PASSWORD}" ]]; then
            if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" ||
                  -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
              echo "Signing secrets are incomplete. Configure all four MeetWave signing secrets." >&2
              exit 1
            fi
            KEYSTORE_PATH="$RUNNER_TEMP/meetwave-release.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            test -s "$KEYSTORE_PATH"
            echo "MEETWAVE_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "release_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_signing=false" >> "$GITHUB_OUTPUT"
            echo "No protected signing key configured; building a debug APK for compile verification only."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.release_signing == 'true'
        working-directory: meetwave-release-keystore
        env:
          MEETWAVE_STORE_PASSWORD: ${{ secrets.MEETWAVE_STORE_PASSWORD }}
          MEETWAVE_KEY_ALIAS: ${{ secrets.MEETWAVE_KEY_ALIAS }}
          MEETWAVE_KEY_PASSWORD: ${{ secrets.MEETWAVE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/meetwave-video-conferencing.apk

      - name: Build debug APK when release signing is not configured
        if: steps.signing.outputs.release_signing != 'true'
        working-directory: meetwave-release-keystore
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/meetwave-video-conferencing.apk

      - name: Verify APK and create checksum
        run: |
          set -euo pipefail
          test -s dist/meetwave-video-conferencing.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose dist/meetwave-video-conferencing.apk
          sha256sum dist/meetwave-video-conferencing.apk > dist/meetwave-video-conferencing.apk.sha256
          printf 'commit=%s\nbuild=%s\nserver=%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$MEETWAVE_SERVER_URL" > dist/BUILD-INFO.txt

      - name: Upload Android build artifact
        uses: actions/upload-artifact@v4
        with:
          name: meetwave-android-build-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest signed Android APK
        if: steps.signing.outputs.release_signing == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: MeetWave Android Latest
          target_commitish: main
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/meetwave-video-conferencing.apk
            dist/meetwave-video-conferencing.apk.sha256
          body: |
            Automated signed MeetWave Android build.
            Commit: ${{ github.sha }}
            Build: ${{ github.run_number }}
            Server: https://meetwave-video-conferencing.onrender.com
