name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate and commit reproducible npm lockfiles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --prefix integrations/mailharbor/source/backend --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json integrations/mailharbor/source/backend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add reproducible dependency lockfiles"
            git push origin HEAD:main
          fi
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit root and MailHarbor dependencies
        run: |
          npm audit --json > "$RUNNER_TEMP/root-npm-audit.json" || true
          npm audit --prefix integrations/mailharbor/source/backend --json > "$RUNNER_TEMP/mailharbor-npm-audit.json" || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let failed = false;
          for (const [label, file] of [
            ['Minglora', process.env.RUNNER_TEMP + '/root-npm-audit.json'],
            ['MailHarbor', process.env.RUNNER_TEMP + '/mailharbor-npm-audit.json']
          ]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (report.error || !report.metadata) {
              console.error(label + ' npm audit did not return a valid advisory report:', report.error || 'missing metadata');
              failed = true;
              continue;
            }
            const summary = report.metadata.vulnerabilities || {};
            console.log(label + ' audit summary:', JSON.stringify(summary));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              console.log(JSON.stringify({
                package: name,
                severity: item.severity,
                direct: item.isDirect,
                range: item.range,
                fixAvailable: item.fixAvailable,
                advisories: (item.via || []).map(entry => typeof entry === 'string' ? entry : ({
                  title: entry.title,
                  url: entry.url,
                  range: entry.range,
                  cwe: entry.cwe,
                  cvss: entry.cvss?.score
                }))
              }, null, 2));
            }
            if (Number(summary.total || 0) > 0) failed = true;
          }
          if (failed) process.exitCode = 1;
          NODE
      - name: Audit production and development dependencies
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/npm-audit.json', 'utf8'));
          const rows = Object.entries(report.vulnerabilities || {}).map(([name, item]) => ({
            name,
            severity: item.severity,
            direct: item.isDirect,
            range: item.range,
            fixAvailable: item.fixAvailable,
            advisories: (item.via || []).map(entry => typeof entry === 'string' ? entry : ({
              title: entry.title,
              url: entry.url,
              range: entry.range,
              cwe: entry.cwe,
              cvss: entry.cvss?.score
            }))
          }));
          console.log(JSON.stringify({ summary: report.metadata?.vulnerabilities || {}, vulnerabilities: rows }, null, 2));
          if (rows.length) process.exitCode = 1;
          NODE
      - name: Check repository structure
        run: npm run check:repo
      - name: Check JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/settings.js
          node --check src/server.js
          node --check src/mailharbor-proxy.js
          node --check src/mailharbor-runtime.js
          node --check src/store.js
          node --check backend/modules/mailharbor/service.js
          node --check backend/modules/mailharbor/oauth.js
          node --check backend/modules/mailharbor/provider.js
          node --check public/mailharbor/app.js
          node --check public/mailharbor/oauth-complete.js
          node --check tests/mailharbor.test.js
          node --check tests/mailharbor-oauth.test.js
          node --check tests/unit/supabase-persistence-retry.test.js
          node --check backend/modules/live/livekit.js
          node --check backend/modules/calls/service.js
          node --check tests/calls.test.js
          node --check tests/unit/profile-image-crop.test.js
          node --check backend/modules/meetwave/service.js
          node --check public/meetwave.js
          node --check tests/unit/livekit.test.js
          node --check tests/unit/meetwave.test.js
          node --check src/domain/validation.js
          node --check src/domain/pagination.js
          node --check src/domain/relationships.js
      - name: Run automated tests
        run: npm test


  mailharbor:
    name: MailHarbor service tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install MailHarbor backend dependencies
        run: npm install --prefix integrations/mailharbor/source/backend --no-audit --no-fund
      - name: Run MailHarbor API and SSO tests
        run: npm test --prefix integrations/mailharbor/source/backend
      - name: Check integrated proxy and web client syntax
        run: |
          node --check src/mailharbor-proxy.js
          node --check public/mailharbor/app.js
