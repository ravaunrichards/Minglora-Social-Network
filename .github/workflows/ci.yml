name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Generate and commit reproducible npm lockfiles
        run:
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --prefix integrations/mailharbor/source/backend --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json integrations/mailharbor/source/backend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: add reproducible dependency lockfiles"
            git push origin HEAD:main
          fi
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate and publish dependency audit report
        run: |
          npm audit --json > "$RUNNER_TEMP/root-npm-audit.json" || true
          npm audit --prefix integrations/mailharbor/source/backend --json > "$RUNNER_TEMP/mailharbor-npm-audit.json" || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const reports = [
            ['Minglora', process.env.RUNNER_TEMP + '/root-npm-audit.json'],
            ['MailHarbor', process.env.RUNNER_TEMP + '/mailharbor-npm-audit.json']
          ];
          let markdown = '# Latest dependency audit\n\nGenerated by GitHub Actions on ' + new Date().toISOString() + '.\n';
          for (const [label, file] of reports) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            markdown += '\n## ' + label + '\n\n';
            if (report.error || !report.metadata) {
              markdown += 'Audit failed: ' + String(report.error?.summary || report.error || 'invalid npm audit response') + '\n';
              continue;
            }
            const summary = report.metadata.vulnerabilities || {};
            markdown += '| Critical | High | Moderate | Low | Total |\n|---:|---:|---:|---:|---:|\n';
            markdown += '| ' + ['critical','high','moderate','low','total'].map(key => Number(summary[key] || 0)).join(' | ') + ' |\n';
            const entries = Object.entries(report.vulnerabilities || {});
            if (!entries.length) markdown += '\nNo vulnerable packages reported.\n';
            for (const [name, item] of entries) {
              markdown += '\n### ' + name + ' (' + item.severity + ')\n\n';
              markdown += '- Affected range: ' + (item.range || 'not provided') + '\n';
              markdown += '- Direct dependency: ' + Boolean(item.isDirect) + '\n';
              markdown += '- Fix available: ' + JSON.stringify(item.fixAvailable) + '\n';
              for (const advisory of item.via || []) {
                if (typeof advisory === 'string') markdown += '- Via: ' + advisory + '\n';
                else markdown += '- Advisory: ' + (advisory.title || 'unnamed') + ' — ' + (advisory.url || 'no URL') + '\n';
              }
            }
          }
          fs.mkdirSync('docs/security', { recursive: true });
          fs.writeFileSync('docs/security/latest-dependency-audit.md', markdown);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/security/latest-dependency-audit.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish dependency audit results"
            git push origin HEAD:main
          fi
      - name: Require zero dependency vulnerabilities
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let failed = false;
          for (const [label, file] of [
            ['Minglora', process.env.RUNNER_TEMP + '/root-npm-audit.json'],
            ['MailHarbor', process.env.RUNNER_TEMP + '/mailharbor-npm-audit.json']
          ]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (report.error || !report.metadata) {
              console.error(label + ' audit failed to return a valid report:', report.error || 'missing metadata');
              failed = true;
              continue;
            }
            const total = Number(report.metadata.vulnerabilities?.total || 0);
            console.log(label + ': ' + total + ' vulnerable package(s).');
            if (total > 0) failed = true;
          }
          if (failed) process.exitCode = 1;
          NODE
      - name: Check repository structure
        run: npm run check:repo
      - name: Check JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/settings.js
          node --check src/server.js
          node --check src/mailharbor-proxy.js
          node --check src/mailharbor-runtime.js
          node --check src/store.js
          node --check backend/modules/mailharbor/service.js
          node --check backend/modules/mailharbor/oauth.js
          node --check backend/modules/mailharbor/provider.js
          node --check public/mailharbor/app.js
          node --check public/mailharbor/oauth-complete.js
          node --check tests/mailharbor.test.js
          node --check tests/mailharbor-oauth.test.js
          node --check tests/unit/supabase-persistence-retry.test.js
          node --check backend/modules/live/livekit.js
          node --check backend/modules/calls/service.js
          node --check tests/calls.test.js
          node --check tests/unit/profile-image-crop.test.js
          node --check backend/modules/meetwave/service.js
          node --check public/meetwave.js
          node --check tests/unit/livekit.test.js
          node --check tests/unit/meetwave.test.js
          node --check src/domain/validation.js
          node --check src/domain/pagination.js
          node --check src/domain/relationships.js
      - name: Run automated tests
        run: npm test


  mailharbor:
    name: MailHarbor service tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install MailHarbor backend dependencies
        run: npm install --prefix integrations/mailharbor/source/backend --no-audit --no-fund
      - name: Run MailHarbor API and SSO tests
        run: npm test --prefix integrations/mailharbor/source/backend
      - name: Check integrated proxy and web client syntax
        run: |
          node --check src/mailharbor-proxy.js
          node --check public/mailharbor/app.js
