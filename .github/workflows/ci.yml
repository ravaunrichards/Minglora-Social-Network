name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate dependency audit report
        run: |
          npm audit --json > "$RUNNER_TEMP/root-npm-audit.json" || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const reports = [
            ['Minglora', process.env.RUNNER_TEMP + '/root-npm-audit.json'],
          ];
          let markdown = '# Dependency security audit\n\n';
          for (const [label, file] of reports) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            markdown += '## ' + label + '\n\n';
            if (report.error || !report.metadata) {
              markdown += 'Audit failed: ' + String(report.error?.summary || report.error || 'invalid npm audit response') + '\n\n';
              continue;
            }
            const summary = report.metadata.vulnerabilities || {};
            markdown += '| Critical | High | Moderate | Low | Total |\n|---:|---:|---:|---:|---:|\n';
            markdown += '| ' + ['critical','high','moderate','low','total'].map(key => Number(summary[key] || 0)).join(' | ') + ' |\n\n';
            const entries = Object.entries(report.vulnerabilities || {});
            if (!entries.length) markdown += 'No vulnerable packages reported.\n\n';
            for (const [name, item] of entries) {
              markdown += '### ' + name + ' (' + item.severity + ')\n\n';
              markdown += '- Affected range: ' + (item.range || 'not provided') + '\n';
              markdown += '- Direct dependency: ' + Boolean(item.isDirect) + '\n';
              markdown += '- Fix available: ' + JSON.stringify(item.fixAvailable) + '\n';
              for (const advisory of item.via || []) {
                if (typeof advisory === 'string') markdown += '- Via: ' + advisory + '\n';
                else markdown += '- Advisory: ' + (advisory.title || 'unnamed') + ' — ' + (advisory.url || 'no URL') + '\n';
              }
              markdown += '\n';
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown);
          NODE
      - name: Require zero dependency vulnerabilities
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          let failed = false;
          for (const [label, file] of [
            ['Minglora', process.env.RUNNER_TEMP + '/root-npm-audit.json'],
          ]) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (report.error || !report.metadata) {
              console.error(label + ' audit failed to return a valid report:', report.error || 'missing metadata');
              failed = true;
              continue;
            }
            const total = Number(report.metadata.vulnerabilities?.total || 0);
            console.log(label + ': ' + total + ' vulnerable package(s).');
            if (total > 0) failed = true;
          }
          if (failed) process.exitCode = 1;
          NODE
      - name: Check repository structure
        run: npm run check:repo
      - name: Check JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/app-lock.js
          node --check public/menu-dismissal.js
          node --check public/friends-advanced.js
          node --check public/gifts.js
          node --check public/gift-effects.js
          node --check scripts/generate-minglora-gifts.mjs
          node --check scripts/generate-minglora-sound-library.mjs
          node --check public/sound-studio-settings.js
          node --check backend/modules/sounds/notification-studio.js
          node --check public/auth-login.js
          node --check public/sw.js
          node --check public/settings.js
          node --check public/experience-center.js
          node --check src/domain/experience-settings.js
          node --check public/admin-centre.js
          node --check public/auth-providers-admin.js
          node --check src/server.js
          node --check src/domain/video-transcode-jobs.js
          node --check src/domain/video-channel-posts.js
          node --check backend/workers/video-transcode/worker.mjs
          node --check src/oauth-flow-state.js
          node --check src/oauth-authorization.js
          node --check src/auth-redirect-routes.js
          node --check src/auth-provider-credentials.js
          node --check tests/unit/oauth-authorization.test.js
          node --check tests/unit/oauth-flow-state.test.js
          node --check tests/unit/auth-redirect-routes.test.js
          node --check tests/unit/auth-provider-credentials.test.js
          node --check src/supabase-auth.js
          node --check src/store.js
          node --check backend/modules/relationships/friends.js
          node --check tests/unit/friends-domain.test.js
          node --check tests/unit/supabase-persistence-retry.test.js
          node --check backend/modules/live/livekit.js
          node --check backend/modules/live/settings.js
          node --check tests/unit/live-settings.test.js
          node --check backend/modules/calls/service.js
          node --check tests/calls.test.js
          node --check tests/unit/profile-image-crop.test.js
          node --check backend/modules/meetwave/service.js
          node --check public/meetwave.js
          node --check tests/unit/livekit.test.js
          node --check tests/unit/meetwave.test.js
          node --check src/domain/validation.js
          node --check src/domain/pagination.js
          node --check src/domain/video-ranking.js
          node --check tests/unit/for-you-video-feed.test.js
          node --check src/domain/relationships.js
      - name: Generate original Minglora gift assets
        run: npm run build:gifts
      - name: Generate Minglora Sound Studio audio pack
        run: npm run build:sounds
      - name: Run automated tests
        run: npm test

  for-you-functional:
    name: For You functional navigation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify real tab clicks, audience connections and direct routes
        run: node --test tests/unit/for-you-scope-clicks.test.js tests/unit/for-you-controls-layout.test.js tests/unit/for-you-home-live-feed.test.js

  auth-provider:
    name: Supabase Auth provider acceptance
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check Auth and OAuth source syntax
        run: |
          node --check src/server.js
          node --check src/supabase-auth.js
          node --check public/auth-login.js
          node --check public/auth-providers-admin.js
          node --check public/sw.js
          node --check tests/unit/auth-oauth-flow.test.js
      - name: Run Auth and OAuth acceptance tests
        run: |
          node --test \
            tests/supabase-auth.test.js \
            tests/unit/auth-email-link-handoff.test.js \
            tests/unit/auth-password-recovery-redirect.test.js \
            tests/unit/auth-registration-resume.test.js \
            tests/unit/auth-oauth-flow.test.js \
            tests/unit/oauth-flow-state.test.js \
            tests/unit/oauth-authorization.test.js \
            tests/unit/auth-redirect-routes.test.js \
            tests/unit/auth-provider-credentials.test.js \
            tests/unit/service-worker-update-before-auth.test.js
