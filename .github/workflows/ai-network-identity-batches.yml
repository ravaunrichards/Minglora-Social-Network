name: Minglora AI identity batch PostgreSQL acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261118063000_minglora_ai_durable_identity_batches.sql'
      - 'supabase/functions/minglora-runtime-state/index.ts'
      - 'src/server.js'
      - 'public/ai-network.js'
      - 'tests/unit/ai-network-batches.test.js'
      - 'tests/integration/ai-network-identity-batches.test.js'
      - '.github/workflows/ai-network-identity-batches.yml'
  push:
    branches: [feat/ai-network-durable-identity-batches-20261118]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-17:
    name: PostgreSQL 17 migration and retry contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minglora_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d minglora_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check SQL and integration test files
        run: |
          node --check tests/unit/ai-network-batches.test.js
          node --check tests/integration/ai-network-identity-batches.test.js
      - name: Execute migration and failed-row recovery contract
        env:
          AI_NETWORK_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/minglora_ai_test
        run: node --test tests/integration/ai-network-identity-batches.test.js
