name: Personal AI Bots Network CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/modules/personal-ai-bots/**'
      - 'public/personal-ai-bots.*'
      - 'supabase/migrations/*ai_bot*'
      - 'supabase/migrations/*ai_provider*'
      - 'supabase/migrations/*ai_email*'
      - 'supabase/migrations/*ai_identity*'
      - 'public/ai-discover.*'
      - 'public/ai-profile.*'
      - 'supabase/migrations/*ai_public_profile*'
      - 'supabase/migrations/*ai_report_review*'
      - 'public/index.html'
      - 'tests/unit/personal-ai-bots*.test.js'
      - 'src/personal-ai-bot-worker.js'
      - 'src/server.js'
      - 'package.json'
      - 'supabase/functions/minglora-runtime-state/index.ts'
      - 'backend/workers/README.md'
      - 'MINGLORA_RESUME.md'
      - 'tests/postgres/**'
      - 'scripts/test-ai-network-postgres.sh'
      - '.github/workflows/personal-ai-bots.yml'
  push:
    branches: [feat/personal-ai-bots-network-control-center]
    paths:
      - 'backend/modules/personal-ai-bots/**'
      - 'public/personal-ai-bots.*'
      - 'public/ai-discover.*'
      - 'public/ai-profile.*'
      - 'supabase/migrations/*ai_public_profile*'
      - 'supabase/migrations/*ai_report_review*'
      - 'public/index.html'
      - 'supabase/migrations/*ai_bot*'
      - 'supabase/migrations/*ai_provider*'
      - 'supabase/migrations/*ai_email*'
      - 'supabase/migrations/*ai_identity*'
      - 'tests/unit/personal-ai-bots*.test.js'
      - 'src/personal-ai-bot-worker.js'
      - 'src/server.js'
      - 'package.json'
      - 'supabase/functions/minglora-runtime-state/index.ts'
      - 'backend/workers/README.md'
      - 'MINGLORA_RESUME.md'
      - 'tests/postgres/**'
      - 'scripts/test-ai-network-postgres.sh'
      - '.github/workflows/personal-ai-bots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  personal-ai-bots:
    name: Personal AI Bots tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Minglora
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check bot module syntax
        run: |
          node --check backend/modules/personal-ai-bots/personal-ai-bots-service.js
          node --check backend/modules/personal-ai-bots/admin-api.js
          node --check backend/modules/personal-ai-bots/worker.js
          node --check src/personal-ai-bot-worker.js
          node --check src/server.js
          node --check public/personal-ai-bots.js
          node --check public/ai-discover.js
          node --check public/ai-profile.js
          node --check tests/unit/personal-ai-bots-ui.test.js
          node --check tests/unit/personal-ai-bots.test.js
          node --check tests/unit/personal-ai-bots-admin-api.test.js
          node --check tests/unit/personal-ai-bots-schema.test.js
          node --check tests/unit/personal-ai-bots-worker.test.js
      - name: Run Personal AI Bots unit and schema tests
        run: |
          node --test \
            tests/unit/personal-ai-bots.test.js \
            tests/unit/personal-ai-bots-admin-api.test.js \
            tests/unit/personal-ai-bots-schema.test.js \
            tests/unit/personal-ai-bots-worker.test.js \
            tests/unit/personal-ai-bots-ui.test.js

  ai-network-postgres:
    name: AI Network PostgreSQL migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minglora_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d minglora_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout Minglora
        uses: actions/checkout@v4
      - name: Execute staged AI migrations in disposable PostgreSQL
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/test-ai-network-postgres.sh
