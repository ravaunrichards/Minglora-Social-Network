name: Minglora seven-plus-two layout visual QA

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout-matrix:
    name: LIVE and MeetWave layout independence matrix
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install isolated Playwright runner
        run: npm install --no-save --package-lock=false playwright@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check visual test syntax
        run: node --check tests/e2e/layout-separation-visual.mjs
      - name: Render every screen and guest-box combination
        run: node tests/e2e/layout-separation-visual.mjs
      - name: Upload layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minglora-seven-plus-two-layout-visual-evidence
          path: artifacts/layout-separation-visual/
          if-no-files-found: warn
          retention-days: 7
