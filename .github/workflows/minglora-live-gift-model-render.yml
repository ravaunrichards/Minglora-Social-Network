name: Minglora LIVE ten-model browser render QA

on:
  push:
    branches: ['**']
    paths:
      - 'assets/3d-assets/gift-models/**'
      - 'scripts/generate-minglora-gifts.mjs'
      - 'tests/e2e/live-gift-model-render.mjs'
      - '.github/workflows/minglora-live-gift-model-render.yml'
      - 'data/minglora-gift-catalog.json'
  pull_request:
    branches: [main]
    paths:
      - 'assets/3d-assets/gift-models/**'
      - 'scripts/generate-minglora-gifts.mjs'
      - 'tests/e2e/live-gift-model-render.mjs'
      - '.github/workflows/minglora-live-gift-model-render.yml'
      - 'data/minglora-gift-catalog.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gift-model-render:
    name: Ten original Minglora gift models — Chromium WebGL
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install isolated Playwright runner
        run: npm install --no-save --package-lock=false playwright@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate canonical Minglora gift models and artwork
        run: npm run build:gifts
      - name: Check render test syntax
        run: node --check tests/e2e/live-gift-model-render.mjs
      - name: Render original Minglora LIVE gift models
        run: node tests/e2e/live-gift-model-render.mjs
      - name: Upload LIVE gift model render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minglora-live-gift-model-render-evidence
          path: artifacts/live-gift-model-render/
          if-no-files-found: warn
          retention-days: 7
