name: Minglora AI Network browser acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/ai-network.js'
      - 'public/ai-network.css'
      - 'public/app.js'
      - 'public/index.html'
      - 'tests/e2e/ai-network-workspace.mjs'
      - '.github/workflows/ai-network-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-ai-network:
    name: AI identity, category management and discovery browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked project dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated Playwright runner
        run: npm install --no-save --package-lock=false playwright@1.56.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check browser test syntax
        run: node --check tests/e2e/ai-network-workspace.mjs
      - name: Exercise AI identity and category lifecycle against disposable API fixtures
        run: node tests/e2e/ai-network-workspace.mjs
      - name: Upload AI Network browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minglora-ai-network-browser-evidence
          path: artifacts/ai-network-browser-qa/
          if-no-files-found: warn
          retention-days: 7
