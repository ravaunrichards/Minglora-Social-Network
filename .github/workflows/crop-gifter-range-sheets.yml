name: Gifter range-sheet edge crop
on:
  push:
    branches:
      - fix/gifter-range-sheet-black-edge-crops-20261115
    paths:
      - ".github/workflows/crop-gifter-range-sheets.yml"
      - "scripts/crop-gifter-range-sheets.py"
permissions:
  contents: write
jobs:
  crop-only-six-range-sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processing dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy
      - name: Crop black outer edges and generate review proof
        run: python scripts/crop-gifter-range-sheets.py --apply
      - name: Upload before-and-after evidence
        uses: actions/upload-artifact@v4
        with:
          name: gifter-range-sheet-crop-review
          path: |
            review-output/
            reports/GIFTER_RANGE_SHEET_CROP_REPORT.md
          if-no-files-found: error
          retention-days: 14
      - name: Commit only the six cropped JPGs and crop report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/Gifters Badge Levels/LV.1 - LV.9.jpg" \
                  "assets/Gifters Badge Levels/LV.10 - LV.19.jpg" \
                  "assets/Gifters Badge Levels/LV.20 - LV.29.jpg" \
                  "assets/Gifters Badge Levels/LV.30 - LV.39.jpg" \
                  "assets/Gifters Badge Levels/LV.40 - LV.49.jpg" \
                  "assets/Gifters Badge Levels/LV.50+.jpg" \
                  "reports/GIFTER_RANGE_SHEET_CROP_REPORT.md"
          if git diff --cached --quiet; then
            echo "No crop needed; no image files changed."
            exit 0
          fi
          git commit -m "assets(gifter): crop black outer margins from range sheets"
          git push origin "${GITHUB_REF_NAME}"
