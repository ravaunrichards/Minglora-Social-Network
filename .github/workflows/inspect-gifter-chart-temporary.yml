name: Temporary Gifter Chart Inspection
on:
  push:
    branches:
      - feature/minglora-gifter-levels
permissions:
  contents: write
jobs:
  export-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export a compact text-safe preview of the existing PNG
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          import base64, io, pathlib
          source = pathlib.Path("assets/Gifters Level Up.png")
          image = Image.open(source).convert("RGB")
          image.thumbnail((1600, 1600), Image.Resampling.LANCZOS)
          output = io.BytesIO()
          image.save(output, format="JPEG", quality=78, optimize=True)
          pathlib.Path("tmp-gifter-chart-preview.b64").write_text(base64.b64encode(output.getvalue()).decode("ascii"))
          print(f"Exported {image.width}x{image.height}, {len(output.getvalue())} bytes")
          PY
      - name: Commit temporary preview for retrieval
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-gifter-chart-preview.b64
          git commit -m "Temporary export for gifter chart cleanup"
          git push
