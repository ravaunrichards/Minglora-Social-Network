<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="0 0 768 768" role="img" aria-labelledby="title desc">
<title id="title">Minglora default member profile picture</title>
<desc id="desc">A neutral white profile silhouette centered inside a light gray circular background and a thin white outer ring.</desc>
<defs>
  <clipPath id="avatar-circle"><circle cx="384" cy="384" r="294"/></clipPath>
  <filter id="soft-shadow" x="42" y="42" width="684" height="684" color-interpolation-filters="sRGB">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
</defs>
<rect width="768" height="768" fill="#fff"/>
<circle cx="384" cy="384" r="318" fill="#000" opacity=".06" filter="url(#soft-shadow)"/>
<circle cx="384" cy="384" r="315" fill="#fff" stroke="#eeeeee" stroke-width="3"/>
<circle cx="384" cy="384" r="294" fill="#c6c6c6"/>
