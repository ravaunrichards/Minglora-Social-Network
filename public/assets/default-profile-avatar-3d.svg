<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">Minglora gender-neutral 3D profile avatar</title>
<desc id="desc">A gender-neutral, faceless, dimensional person icon with a smooth rounded head and shoulders on a luminous blue-violet background.</desc>
<defs>
 <linearGradient id="bg" x1="110" y1="55" x2="908" y2="1005" gradientUnits="userSpaceOnUse"><stop stop-color="#0b2257"/><stop offset=".48" stop-color="#1769e0"/><stop offset="1" stop-color="#542b9a"/></linearGradient>
 <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="matrix(0 520 -520 0 510 390)" gradientUnits="userSpaceOnUse"><stop stop-color="#c2f5ff" stop-opacity=".78"/><stop offset=".52" stop-color="#7ad5ff" stop-opacity=".2"/><stop offset="1" stop-color="#7ad5ff" stop-opacity="0"/></radialGradient>
 <linearGradient id="head" x1="337" y1="252" x2="693" y2="691" gradientUnits="userSpaceOnUse"><stop stop-color="#f7fdff"/><stop offset=".3" stop-color="#d9f2ff"/><stop offset=".66" stop-color="#9cc9f5"/><stop offset="1" stop-color="#527fc8"/></linearGradient>
 <linearGradient id="headSide" x1="606" y1="340" x2="754" y2="656" gradientUnits="userSpaceOnUse"><stop stop-color="#9bc9ef" stop-opacity="0"/><stop offset="1" stop-color="#31599b" stop-opacity=".8"/></linearGradient>
 <linearGradient id="body" x1="268" y1="665" x2="761" y2="1040" gradientUnits="userSpaceOnUse"><stop stop-color="#e9faff"/><stop offset=".22" stop-color="#9be8ff"/><stop offset=".55" stop-color="#438fe8"/><stop offset="1" stop-color="#243d9c"/></linearGradient>
 <linearGradient id="bodySide" x1="530" y1="760" x2="885" y2="1030" gradientUnits="userSpaceOnUse"><stop stop-color="#4da9f0" stop-opacity="0"/><stop offset="1" stop-color="#1b2675" stop-opacity=".72"/></linearGradient>
 <linearGradient id="neck" x1="420" y1="570" x2="627" y2="780" gradientUnits="userSpaceOnUse"><stop stop-color="#edfaff"/><stop offset=".55" stop-color="#a7d9f5"/><stop offset="1" stop-color="#648fc9"/></linearGradient>
 <linearGradient id="glass" x1="235" y1="180" x2="800" y2="840" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <filter id="shadow" x="110" y="160" width="820" height="940" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="30"/></filter>
 <filter id="glow" x="0" y="0" width="1024" height="1024" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
